	# ============================================================
	# Accustanda ERP Dashboard Demo (https://delegateops.business/accustanda/demo)
	# ============================================================

	handle /accustanda/demo {
		redir * /accustanda/demo/ 308
	}

	handle_path /accustanda/demo/* {
		header {
			>Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
			>X-Robots-Tag "noindex, nofollow, noarchive"
		}

		root * /home/jk/bridge-ph/accustanda-demo

		route {
			try_files {path} {path}.html {path}/index.html /index.html

			@revalidate path / /index.html /sw.js /manifest.webmanifest
			header @revalidate >Cache-Control "public, max-age=0, must-revalidate"

			@fingerprinted_assets path /_next/* /assets/*
			header @fingerprinted_assets >Cache-Control "public, max-age=31536000, immutable"

			file_server
		}
	}
